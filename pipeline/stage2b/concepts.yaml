concepts:
  - id: overlap_run
    name_zh: 套边
    name_en: overlap run
    aliases:
      zh: [套上]
      en: [overlap, overlapping run]
    observation_definition: 同队跑动者从持球人身后沿外侧移动到身前；排除内侧套上、已经在身前的平行接应和防守回追。
    required_actor_roles: [carrier_track_id, runner_track_id]
    actor_team_constraints: {carrier_track_id: same, runner_track_id: same}
    sources:
      terminology: [soccermaster_operational_definitions_v1]
      formalization: [tacticgen_arxiv_2604_18210_v1]
      calibration: []
    allowed_claim_levels: [observation]
    maturity: planned
    production_enabled: false

  - id: run_in_behind
    name_zh: 前插身后
    name_en: run in behind
    aliases:
      zh: [打身后]
      en: [depth_run]
    observation_definition: 同队跑动者在球队控制或推进球时，从相关可见防线身前移动到其身后空间；排除回追、依赖画外球员的判断和瞬时噪声越线。
    required_actor_roles: [carrier_track_id, runner_track_id]
    actor_team_constraints: {carrier_track_id: same, runner_track_id: same}
    sources:
      terminology: [soccermaster_operational_definitions_v1]
      formalization: [tacticgen_arxiv_2604_18210_v1]
      calibration: []
    allowed_claim_levels: [observation]
    maturity: planned
    production_enabled: false

  - id: switch_of_play
    name_zh: 弱侧转移
    name_en: switch of play
    aliases:
      zh: [大范围转移]
      en: [switch_play]
    observation_definition: 受控的同队球权转移使活跃区域从传球者所在一侧切换到接球者所在另一侧；排除解围、折射和仍停留在同侧的斜传。
    required_actor_roles: [passer_track_id, receiver_track_id]
    actor_team_constraints: {passer_track_id: same, receiver_track_id: same}
    sources:
      terminology: [soccermaster_operational_definitions_v1]
      formalization: [gentac_arxiv_2604_11786_v1, tacticgen_arxiv_2604_18210_v1]
      calibration: []
    allowed_claim_levels: [observation]
    maturity: planned
    production_enabled: false

  - id: local_numerical_superiority
    name_zh: 局部人数优势
    name_en: local numerical superiority
    aliases:
      zh: [局部以多打少]
      en: [numerical_superiority]
    observation_definition: 在锚点周围固定局部区域内，提议球队持续具有可见球员数量优势；排除单帧计数变化和依赖画外缺席球员的判断。
    required_actor_roles: [anchor_track_id]
    actor_team_constraints: {anchor_track_id: same}
    sources:
      terminology: [soccermaster_operational_definitions_v1]
      formalization: [gentac_arxiv_2604_11786_v1, tacticgen_arxiv_2604_18210_v1]
      calibration: []
    allowed_claim_levels: [observation]
    maturity: planned
    production_enabled: false

  - id: compact_block
    name_zh: 紧凑防守阵型
    name_en: compact block
    aliases:
      zh: [紧凑防守]
      en: [defensive compactness]
    observation_definition: 可见的无球方在持续时段内保持紧凑的球员间宽度、纵深和线间距；排除低可见度和围绕一次对抗的短暂收缩。
    required_actor_roles: []
    actor_team_constraints: {}
    sources:
      terminology: [soccermaster_operational_definitions_v1]
      formalization: [gentac_arxiv_2604_11786_v1, tacticgen_arxiv_2604_18210_v1]
      calibration: []
    allowed_claim_levels: [observation]
    maturity: planned
    production_enabled: false

  - id: line_break
    name_zh: 破线传球
    name_en: line break
    aliases:
      zh: [穿线传球]
      en: [line-breaking pass]
    observation_definition: 从传球者到接球者的受控传球在保持球权时越过一条定义明确的可见对手防线；排除盘带、解围以及标定或身份错误造成的表观越线。
    required_actor_roles: [passer_track_id, receiver_track_id]
    actor_team_constraints: {passer_track_id: same, receiver_track_id: same}
    sources:
      terminology: [soccermaster_operational_definitions_v1]
      formalization: [gentac_arxiv_2604_11786_v1, tacticgen_arxiv_2604_18210_v1]
      calibration: []
    allowed_claim_levels: [observation]
    maturity: planned
    production_enabled: false

  - id: underlap_run
    name_zh: 肋部套上
    name_en: underlap run
    aliases:
      zh: [内侧套上]
      en: [underlap]
    observation_definition: 同队跑动者从持球人身后经内侧通道移动到身前；排除外侧套边、直线平行接应和防守回追。
    required_actor_roles: [carrier_track_id, runner_track_id]
    actor_team_constraints: {carrier_track_id: same, runner_track_id: same}
    sources:
      terminology: [soccermaster_operational_definitions_v1]
      formalization: [tacticgen_arxiv_2604_18210_v1]
      calibration: []
    allowed_claim_levels: [observation]
    maturity: planned
    production_enabled: false

  - id: side_overload
    name_zh: 边路重载
    name_en: side overload
    aliases:
      zh: [边路人数集中]
      en: [wide overload]
    observation_definition: 提议球队在活跃边路通道内持续保持可见的局部球员数量集中；排除一次对抗周围的短暂聚集和依赖画外缺席球员的判断。
    required_actor_roles: [anchor_track_id]
    actor_team_constraints: {anchor_track_id: same}
    sources:
      terminology: [soccermaster_operational_definitions_v1]
      formalization: [gentac_arxiv_2604_11786_v1, tacticgen_arxiv_2604_18210_v1]
      calibration: []
    allowed_claim_levels: [observation]
    maturity: planned
    production_enabled: false

  - id: halfspace_occupation
    name_zh: 肋部占位
    name_en: halfspace occupation
    aliases:
      zh: [半空间占位]
      en: [half-space occupation]
    observation_definition: 同队球员在中路与边线之间定义的通道内持续占位；排除贴边宽度、中路占位和短暂穿越。
    required_actor_roles: [occupant_track_id]
    actor_team_constraints: {occupant_track_id: same}
    sources:
      terminology: [soccermaster_operational_definitions_v1]
      formalization: [gentac_arxiv_2604_11786_v1, tacticgen_arxiv_2604_18210_v1]
      calibration: []
    allowed_claim_levels: [observation]
    maturity: planned
    production_enabled: false

  - id: width_depth_stretch
    name_zh: 宽度纵深拉伸
    name_en: width-depth stretch
    aliases:
      zh: [宽度与纵深]
      en: [width and depth]
    observation_definition: 同一球队同时保持可见的宽度选择和纵深选择，从两个不同空间维度拉开站位；排除仅有宽度或仅有纵深以及单帧极值。
    required_actor_roles: [wide_player_track_id, depth_player_track_id]
    actor_team_constraints: {wide_player_track_id: same, depth_player_track_id: same}
    sources:
      terminology: [soccermaster_operational_definitions_v1]
      formalization: [gentac_arxiv_2604_11786_v1, tacticgen_arxiv_2604_18210_v1]
      calibration: []
    allowed_claim_levels: [observation]
    maturity: planned
    production_enabled: false

  - id: one_two
    name_zh: 二过一
    name_en: one-two
    aliases:
      zh: [撞墙配合]
      en: [give-and-go, wall pass]
    observation_definition: 第一传球者继续移动，并在一次有序交换中接到墙式配合球员的受控回传；排除两次无关传球、角色顺序反转和没有受控回传的交换。
    required_actor_roles: [first_passer_track_id, wall_player_track_id]
    actor_team_constraints: {first_passer_track_id: same, wall_player_track_id: same}
    sources:
      terminology: [soccermaster_operational_definitions_v1]
      formalization: [tacticgen_arxiv_2604_18210_v1]
      calibration: []
    allowed_claim_levels: [observation]
    maturity: planned
    production_enabled: false

  - id: third_man_run
    name_zh: 第三人跑动
    name_en: third-man run
    aliases:
      zh: [第三人配合]
      en: [third man combination]
    observation_definition: 第一传球者经连接球员与不同的第三名跑动者形成有序三人序列；排除普通两人配合和第三人没有接球移动的情况。
    required_actor_roles: [first_passer_track_id, link_player_track_id, runner_track_id]
    actor_team_constraints: {first_passer_track_id: same, link_player_track_id: same, runner_track_id: same}
    sources:
      terminology: [soccermaster_operational_definitions_v1]
      formalization: [tacticgen_arxiv_2604_18210_v1]
      calibration: []
    allowed_claim_levels: [observation]
    maturity: planned
    production_enabled: false

  - id: high_press
    name_zh: 高位逼抢
    name_en: high press
    aliases:
      zh: [前场逼抢]
      en: [high pressing]
    observation_definition: 可见的无球方在对手组织区域持续施加近距离压力，包括绑定的逼抢者和对手持球者；排除单人孤立追赶以及基于低可见度或画外球员的判断。
    required_actor_roles: [presser_track_id, opponent_carrier_track_id]
    actor_team_constraints: {presser_track_id: same, opponent_carrier_track_id: opponent}
    sources:
      terminology: [soccermaster_operational_definitions_v1]
      formalization: [gentac_arxiv_2604_11786_v1, tacticgen_arxiv_2604_18210_v1]
      calibration: []
    allowed_claim_levels: [observation]
    maturity: planned
    production_enabled: false

  - id: low_block
    name_zh: 低位防守
    name_en: low block
    aliases:
      zh: [低位防守阵型]
      en: [deep defensive block]
    observation_definition: 可见的无球方在本方球门附近持续保持紧凑防守阵型；排除短暂回撤、重新开球站位和需要依赖不可见球员的结论。
    required_actor_roles: []
    actor_team_constraints: {}
    sources:
      terminology: [soccermaster_operational_definitions_v1]
      formalization: [gentac_arxiv_2604_11786_v1, tacticgen_arxiv_2604_18210_v1]
      calibration: []
    allowed_claim_levels: [observation]
    maturity: planned
    production_enabled: false
